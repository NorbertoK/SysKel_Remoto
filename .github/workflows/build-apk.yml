name: Build SysKelKey APK

on:
  push:
    paths:
      - 'SysKelKey/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SysKelKey

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - run: gradle assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SysKelKey-APK
          path: SysKelKey/app/build/outputs/apk/debug/app-debug.apk
